paths:
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Liveness check. The only route without a token.
      security: []
      responses:
        "200":
          description: Up
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok: { type: boolean }
              example: { ok: true }

  /api/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List agent sessions, newest first
      parameters:
        - { name: status, in: query, schema: { $ref: "./action.schema.json#/$defs/SessionStatus" } }
        - { name: agent_kind, in: query, schema: { $ref: "./action.schema.json#/$defs/AgentKind" } }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Sessions, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "./action.schema.json#/$defs/Session" }
              examples:
                default:
                  value:
                    - *SessionActive
                    - *SessionReplay
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/sessions/{session_id}:
    get:
      tags: [sessions]
      operationId: getSession
      summary: One session
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: { $ref: "./action.schema.json#/$defs/Session" }
              examples:
                active: { $ref: "#/components/examples/SessionActive" }
                replay: { $ref: "#/components/examples/SessionReplay" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/actions:
    get:
      tags: [actions]
      operationId: listActions
      summary: Action timeline, oldest first unless order=desc
      parameters:
        - name: session_id
          in: query
          schema: { type: string, pattern: "^ses_[0-9A-HJKMNP-TV-Z]{26}$" }
        - name: since
          in: query
          description: Only actions created at or after this time.
          schema: { type: string, format: date-time }
        - { name: system, in: query, schema: { $ref: "./action.schema.json#/$defs/System" } }
        - { name: status, in: query, schema: { $ref: "./action.schema.json#/$defs/ActionStatus" } }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Actions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "./action.schema.json#/$defs/Action" }
              examples:
                default:
                  value:
                    - *ActionDeleteExecuted
                    - *ActionUpdatePrice
                    - *ActionDropTable
                    - *ActionEmailHeld
                    - *ActionUpstreamHeld
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/actions/{action_id}:
    get:
      tags: [actions]
      operationId: getAction
      summary: One action
      parameters:
        - $ref: "#/components/parameters/ActionIdPath"
      responses:
        "200":
          description: The action
          content:
            application/json:
              schema: { $ref: "./action.schema.json#/$defs/Action" }
              examples:
                deleteExecuted: { $ref: "#/components/examples/ActionDeleteExecuted" }
                updatePrice: { $ref: "#/components/examples/ActionUpdatePrice" }
                dropTable: { $ref: "#/components/examples/ActionDropTable" }
                emailHeld: { $ref: "#/components/examples/ActionEmailHeld" }
                upstreamHeld: { $ref: "#/components/examples/ActionUpstreamHeld" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/rewind:
    post:
      tags: [rewind]
      operationId: createRewind
      summary: Plan (dry_run, the default) or run a rewind
      description: |
        dry_run=true returns 200 with status `planned`: every step `pending`, with its per-field diff, and nothing changed.
        dry_run=false returns 202 with status `running`. Follow it with `GET /api/rewind/{id}` or the `rewind.*` events.
        Steps go newest action first. Only one rewind runs at a time; a second gets 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./action.schema.json#/$defs/RewindRequest" }
            examples:
              planSession:
                value: { scope: { session_id: ses_01M561Q6R04CJZXHXRCFFNM7C4 }, dry_run: true, requested_by: dashboard }
              runSession:
                value: { scope: { session_id: ses_01M561Q6R04CJZXHXRCFFNM7C4 }, dry_run: false, requested_by: dashboard }
              rewindToTime:
                value: { scope: { session_id: ses_01M561Q6R04CJZXHXRCFFNM7C4, since: "2026-10-17T23:04:10Z" }, dry_run: true }
      responses:
        "200":
          description: Dry run. The plan, nothing changed.
          content:
            application/json:
              schema: { $ref: "./action.schema.json#/$defs/RewindJob" }
              examples:
                planned: { $ref: "#/components/examples/RewindPlanned" }
        "202":
          description: Run accepted and started
          content:
            application/json:
              schema: { $ref: "./action.schema.json#/$defs/RewindJob" }
              examples:
                running: { $ref: "#/components/examples/RewindRunning" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
    get:
      tags: [rewind]
      operationId: listRewinds
      summary: Rewind jobs, newest first
      parameters:
        - name: session_id
          in: query
          schema: { type: string, pattern: "^ses_[0-9A-HJKMNP-TV-Z]{26}$" }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "./action.schema.json#/$defs/RewindJob" }
              examples:
                default:
                  value:
                    - *RewindCompleted
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/rewind/{rewind_job_id}:
    get:
      tags: [rewind]
      operationId: getRewind
      summary: Rewind progress and result
      parameters:
        - name: rewind_job_id
          in: path
          required: true
          schema: { type: string, pattern: "^rwd_[0-9A-HJKMNP-TV-Z]{26}$" }
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "./action.schema.json#/$defs/RewindJob" }
              examples:
                completed: { $ref: "#/components/examples/RewindCompleted" }
                running: { $ref: "#/components/examples/RewindRunning" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/approvals/{action_id}/decision:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Approve or reject a held action
      description: |
        Called by the Photon service when a reply like `YES 4821` arrives (channel imessage), or by the dashboard (channel dashboard).
        The code must match the action's approval code. Returns the action with its new status:
        `approved` (then `executing`, `executed` as the hold releases) or `rejected`.
      parameters:
        - $ref: "#/components/parameters/ActionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./action.schema.json#/$defs/ApprovalDecisionRequest" }
            examples:
              imessageYes:
                value: { decision: approve, code: "4821", channel: imessage, decided_by: "imessage:+15555550123" }
              dashboardReject:
                value: { decision: reject, code: "4821", channel: dashboard, decided_by: dashboard }
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: "./action.schema.json#/$defs/Action" }
              examples:
                approved: { $ref: "#/components/examples/ActionEmailApproved" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The action isn't held (already decided, expired or never held)
          content:
            application/json:
              schema: { $ref: "./action.schema.json#/$defs/ErrorResponse" }
              example: { detail: "action is approved, not held" }
        "422":
          description: Wrong code, or an invalid body
          content:
            application/json:
              schema: { $ref: "./action.schema.json#/$defs/ErrorResponse" }
              example: { detail: "code does not match" }

  /api/checksums:
    get:
      tags: [checksums]
      operationId: getChecksums
      summary: Current checksum per system
      parameters:
        - name: recompute
          in: query
          description: Recompute now instead of returning the last computed values.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Checksums keyed by system
          content:
            application/json:
              schema: { $ref: "./action.schema.json#/$defs/Checksums" }
              examples:
                default: { $ref: "#/components/examples/Checksums" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Server-sent events (see contracts/events.md)
      description: |
        Each event is framed as `id: <seq>`, `event: <name>`, `data: <JSON envelope>`.
        The envelope is a `MulliganEvent` from action.schema.json. A `: ping` comment is sent every 15 s.
        Reconnect with `Last-Event-ID` to receive events missed since that seq (up to the last 1,000).
        Browsers' `EventSource` can't send headers, so use a fetch-based client (for example
        `@microsoft/fetch-event-source`) with the `Authorization` header.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                id: 41
                event: action.held
                data: {"event":"action.held","seq":41,"ts":"2026-10-17T23:04:28Z","data":{"id":"act_01M561R2302EME3JAF7RBZWM16","status":"held"}}

        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/demo/reset:
    post:
      tags: [demo]
      operationId: demoReset
      summary: Wipe and reseed prod-db, GitHub and Notion, clear the log, return checksums
      description: Dev only. Needs `MULLIGAN_DEMO=1` and the dashboard token; 404 otherwise.
      security:
        - dashboardToken: []
      responses:
        "200":
          description: Reset done
          content:
            application/json:
              schema: { $ref: "./action.schema.json#/$defs/DemoResetResult" }
              example:
                ok: true
                checksums: *Checksums
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
