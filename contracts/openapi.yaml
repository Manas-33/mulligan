openapi: 3.1.0
info:
  title: Mulligan gateway REST API
  version: 0.1.0
  description: |
    REST and SSE for the dashboard, the Photon service, the Fetch agent and the demo scripts.
    Agents never use this API; they reach Mulligan over MCP on its own port.

    **Where it listens.** The gateway serves this API on port 8000 (`MULLIGAN_API_PORT`).
    - Browser code and host processes (dashboard in the browser, Fetch agent, demo scripts) use `http://127.0.0.1:8000`.
      Under docker compose the host port is bound to `127.0.0.1` only.
    - Containers on the compose network (the Photon service) use `http://gateway:8000`.
      `127.0.0.1` inside a container is that container, not the gateway.
    - The cloudflared tunnel never points here. It exposes only the MCP port (8001).

    **Auth.** Every route needs a token except `GET /healthz`.
    - Dashboard: `Authorization: Bearer <MULLIGAN_DASHBOARD_TOKEN>`.
    - Services (Photon, Fetch): `X-Mulligan-Service-Token: <MULLIGAN_SERVICE_TOKEN>`.
    - A missing or wrong token gets 401. `/api/demo/reset` needs the dashboard token and `MULLIGAN_DEMO=1`, and is 404 otherwise.

    **CORS.** The gateway allows the origins in `MULLIGAN_CORS_ORIGINS` (default `http://localhost:5173,http://127.0.0.1:5173`).

    **Mock.** `make mocks` serves this spec with Prism on `http://127.0.0.1:4010`, using the examples below.
    Send `Prefer: example=<name>` to pick an example, or `Prefer: code=<status>` for another response.
servers:
  - url: http://127.0.0.1:8000
    description: Gateway from the browser or a host process
  - url: http://gateway:8000
    description: Gateway from a container on the compose network
  - url: http://127.0.0.1:4010
    description: Prism mock (make mocks)
security:
  - dashboardToken: []
  - serviceToken: []
tags:
  - name: sessions
  - name: actions
  - name: rewind
  - name: approvals
  - name: checksums
  - name: events
  - name: demo
  - name: health

components:
  securitySchemes:
    dashboardToken:
      type: http
      scheme: bearer
      description: MULLIGAN_DASHBOARD_TOKEN
    serviceToken:
      type: apiKey
      in: header
      name: X-Mulligan-Service-Token
      description: MULLIGAN_SERVICE_TOKEN (Photon service, Fetch agent)

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
    SessionIdPath:
      name: session_id
      in: path
      required: true
      schema: { type: string, pattern: "^ses_[0-9A-HJKMNP-TV-Z]{26}$" }
    ActionIdPath:
      name: action_id
      in: path
      required: true
      schema: { type: string, pattern: "^act_[0-9A-HJKMNP-TV-Z]{26}$" }

  responses:
    Unauthorized:
      description: Missing or wrong token
      content:
        application/json:
          schema: { $ref: "./action.schema.json#/$defs/ErrorResponse" }
          example: { detail: "missing or invalid token" }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: "./action.schema.json#/$defs/ErrorResponse" }
          example: { detail: "not found" }
    Conflict:
      description: A rewind is already running
      content:
        application/json:
          schema: { $ref: "./action.schema.json#/$defs/ErrorResponse" }
          example: { detail: "rewind rwd_01M561RFRGVASABYV8XG40DDX0 is running" }
    Invalid:
      description: Invalid body
      content:
        application/json:
          schema: { $ref: "./action.schema.json#/$defs/ErrorResponse" }
          example: { detail: [{ loc: [body, scope], msg: "scope needs at least one field", type: value_error }] }

  examples:
    SessionActive:
      summary: Live Claude Code session, still running
      value: &SessionActive
        id: ses_01M561Q6R04CJZXHXRCFFNM7C4
        agent: { id: claude_code, kind: claude_code, display_name: Claude Code }
        mode: live
        started_at: "2026-10-17T23:04:00Z"
        ended_at: null
        action_count: 5
        status: active
    SessionReplay:
      summary: Recorded rogue-agent run replayed for the demo
      value: &SessionReplay
        id: ses_01M561RPK8R9VB7NKR3B61H8GW
        agent: { id: rogue_replay, kind: rogue, display_name: Cleanup agent (replay) }
        mode: replay
        started_at: "2026-10-17T22:40:00Z"
        ended_at: "2026-10-17T22:41:12Z"
        action_count: 58
        status: rewound

    ActionDeleteExecuted:
      summary: pg_delete_rows that cascaded into two child tables
      value: &ActionDeleteExecuted
        id: act_01M561QDJRQ23HY0VT7QKFVHHZ
        session_id: ses_01M561Q6R04CJZXHXRCFFNM7C4
        agent: { id: claude_code, kind: claude_code, display_name: Claude Code }
        system: postgres
        tool: pg_delete_rows
