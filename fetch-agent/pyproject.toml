[project]
name = "mulligan-fetch-agent"
version = "0.1.0"
description = "Mulligan Guardian and worker agents for ASI:One (uAgents chat protocol)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "uagents==0.26.1",
    "uagents-core==0.4.12",
    "openai==3.35.0",
    "httpx==0.28.1",
    "mcp==2.3.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
