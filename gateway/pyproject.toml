[project]
name = "mulligan-gateway"
version = "0.1.0"
description = "Mulligan: the MCP gateway that records, holds and rewinds what AI agents do."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "httpx==0.28.1",
    "sentry-sdk[fastapi]==2.72.0",
    "pyyaml==6.0.3",
    "python-ulid==4.0.1",
    "sse-starlette==3.5.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "datamodel-code-generator==0.85.0",
    "jsonschema==4.26.0",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mulligan"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mulligan/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"mulligan/adapters/postgres/*" = ["E501"]  # inline SQL
"mulligan/mcp_server/*" = ["B008"]  # Field() defaults are how the MCP SDK reads tool schemas

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["mulligan"]

[[tool.mypy.overrides]]
module = ["mulligan.mcp_server.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["mulligan.models"]
disallow_any_explicit = false
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs docker compose up (both Postgres DBs)",
    "live: talks to the real Notion workspace (MULLIGAN_LIVE_NOTION=1)",
]
addopts = "-m 'not integration and not live'"
